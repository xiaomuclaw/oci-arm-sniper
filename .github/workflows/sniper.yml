name: Oracle ARM Sniper

on:
  workflow_dispatch:
    inputs:
      ocpus:
        description: 'OCPU count (Always Free total = 2 as of 2026-08)'
        default: '2'
      memory_gb:
        description: 'Memory in GB (Always Free total = 12 as of 2026-08)'
        default: '12'
      os_version:
        description: 'Ubuntu version'
        default: '24.04'
      boot_gb:
        description: 'Boot volume GB (Always Free storage total = 200)'
        default: '150'

  schedule:
    # Safety net only — the relay in the last step is what actually keeps this
    # going. GitHub's cron is best-effort and was not firing at all here, so
    # this exists to restart the chain if a relay link is ever lost.
    - cron: '17 */3 * * *'

# One sniper at a time. cancel-in-progress must stay false: a cron tick or a
# duplicate relay must never kill a run that is mid-hunt.
concurrency:
  group: oracle-arm-sniper
  cancel-in-progress: false

permissions:
  issues: write   # to file the "instance acquired" report
  actions: write  # to disable the cron once we win

jobs:
  snipe:
    name: Snipe A1.Flex
    runs-on: ubuntu-latest
    timeout-minutes: 55
    env:
      OCI_CLI_SUPPRESS_FILE_PERMISSIONS_WARNING: 'True'
      SUPPRESS_LABEL_WARNING: 'True'
      OCI_TENANCY: ${{ secrets.TENANCY_OCID }}
      OCI_USER: ${{ secrets.USER_OCID }}
      OCI_REGION: ${{ secrets.REGION }}
      OCI_FINGERPRINT: ${{ secrets.FINGERPRINT }}
      SUBNET_ID: ${{ secrets.SUBNET_ID }}
      OCPUS: ${{ inputs.ocpus || '2' }}
      MEMORY_GB: ${{ inputs.memory_gb || '12' }}
      OS_VERSION: ${{ inputs.os_version || '24.04' }}
      BOOT_GB: ${{ inputs.boot_gb || '150' }}
      DEADLINE_SECONDS: '2640'   # 44 min, leaves headroom under timeout-minutes
      SLEEP_BETWEEN_ADS: '5'
      SLEEP_BETWEEN_PASSES: '85'   # measured equilibrium; see README on the quota ceiling

    steps:
      - name: Install OCI CLI
        run: |
          curl -fsSL -o /tmp/oci-install.sh \
            https://raw.githubusercontent.com/oracle/oci-cli/master/scripts/install/install.sh
          chmod +x /tmp/oci-install.sh
          /tmp/oci-install.sh --accept-all-defaults >/tmp/oci-install.log 2>&1 \
            || { tail -40 /tmp/oci-install.log; exit 1; }
          echo "$HOME/bin" >> "$GITHUB_PATH"

      - name: Write OCI config
        run: |
          mkdir -p ~/.oci ~/.ssh
          cat > ~/.oci/config <<EOF
          [DEFAULT]
          user=${OCI_USER}
          fingerprint=${OCI_FINGERPRINT}
          tenancy=${OCI_TENANCY}
          region=${OCI_REGION}
          key_file=$HOME/.oci/key.pem
          EOF
          cat > ~/.oci/key.pem <<'EOF'
          ${{ secrets.PRIVATE_KEY }}
          EOF
          cat > ~/.ssh/oracle.pub <<'EOF'
          ${{ secrets.USER_SSH_PUB_KEY }}
          EOF
          # Tolerate a key pasted with leading spaces; PEM/SSH lines have none.
          sed -i 's/^[[:space:]]*//' ~/.oci/key.pem ~/.ssh/oracle.pub
          chmod 600 ~/.oci/config ~/.oci/key.pem
          # Fail loudly now rather than looking like "no stock" for 45 minutes.
          if ! grep -q 'BEGIN.*PRIVATE KEY' ~/.oci/key.pem; then
            echo "::error::PRIVATE_KEY secret is not a PEM private key."
            echo "Paste the whole api_key.pem including BEGIN/END lines."
            exit 1
          fi
          if ! grep -qE '^(ssh-rsa|ssh-ed25519|ecdsa-sha2-)' ~/.ssh/oracle.pub; then
            echo "::error::USER_SSH_PUB_KEY is not an SSH public key."
            echo "Use the .pub file contents (starts with ssh-rsa or ssh-ed25519)."
            exit 1
          fi

      - name: Preflight — verify credentials and resolve targets
        run: |
          # +e because every check below reports its own error message; the
          # default `bash -e` would abort first and print nothing useful.
          set +e -uo pipefail

          # Keep stderr out of the JSON: the CLI prints a key-permissions
          # warning ahead of the payload, which makes jq choke.
          if ! ADS_JSON=$(oci iam availability-domain list 2>/tmp/ad.err); then
            echo "::error::Cannot authenticate to OCI. Check TENANCY_OCID, USER_OCID, FINGERPRINT, PRIVATE_KEY, REGION."
            tail -20 /tmp/ad.err
            exit 1
          fi
          mapfile -t ADS < <(echo "$ADS_JSON" | jq -r '.data[].name' 2>/dev/null | sort)
          if [ "${#ADS[@]}" -eq 0 ]; then
            echo "::error::No availability domains parsed for this region."
            echo "--- stdout ---"; echo "$ADS_JSON" | head -30
            echo "--- stderr ---"; head -10 /tmp/ad.err
            exit 1
          fi

          IMAGE_ID=$(oci compute image list \
            --compartment-id "$OCI_TENANCY" \
            --operating-system 'Canonical Ubuntu' \
            --operating-system-version "$OS_VERSION" \
            --shape 'VM.Standard.A1.Flex' \
            --sort-by TIMECREATED --sort-order DESC \
            --query 'data[0].id' --raw-output 2>/dev/null)
          if [ -z "${IMAGE_ID:-}" ] || [ "$IMAGE_ID" = "null" ]; then
            echo "::error::No Ubuntu $OS_VERSION ARM image found in $OCI_REGION."
            exit 1
          fi

          # Confirm the subnet exists and note its VCN, so a wrong-region subnet
          # surfaces here instead of masquerading as an out-of-capacity error.
          if ! SUBNET=$(oci network subnet get --subnet-id "$SUBNET_ID" 2>/tmp/sub.err); then
            echo "::error::SUBNET_ID is not reachable in region $OCI_REGION."
            tail -10 /tmp/sub.err
            exit 1
          fi

          {
            echo "ADS=${ADS[*]}"
            echo "IMAGE_ID=$IMAGE_ID"
          } >> "$GITHUB_ENV"

          echo "Region      : $OCI_REGION"
          echo "Domains     : ${ADS[*]}"
          echo "Shape       : VM.Standard.A1.Flex  ${OCPUS} OCPU / ${MEMORY_GB} GB / ${BOOT_GB} GB disk"
          echo "Image       : $IMAGE_ID (Ubuntu $OS_VERSION)"
          echo "Subnet      : $(echo "$SUBNET" | jq -r '.data."display-name"' 2>/dev/null || echo '(name unavailable)')"

      # Disabling the schedule cannot cancel an already-queued relay, so every
      # run checks for itself whether the hunt is already over.
      - name: Stop if an ARM instance already exists
        id: existing
        run: |
          set +e -uo pipefail
          RUNNING=$(oci compute instance list \
                      --compartment-id "$OCI_TENANCY" \
                      --lifecycle-state RUNNING \
                      2>/dev/null \
                    | jq -r '[.data[]? | select(.shape=="VM.Standard.A1.Flex")] | length' \
                      2>/dev/null)
          PROV=$(oci compute instance list \
                   --compartment-id "$OCI_TENANCY" \
                   --lifecycle-state PROVISIONING \
                   2>/dev/null \
                 | jq -r '[.data[]? | select(.shape=="VM.Standard.A1.Flex")] | length' \
                   2>/dev/null)
          TOTAL=$(( ${RUNNING:-0} + ${PROV:-0} ))
          echo "existing A1.Flex instances: running=${RUNNING:-0} provisioning=${PROV:-0}"
          if [ "$TOTAL" -gt 0 ]; then
            echo "::notice::An A1.Flex instance already exists — nothing left to snipe."
            echo "done=true" >> "$GITHUB_OUTPUT"
          else
            echo "done=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Snipe loop
        id: snipe
        if: steps.existing.outputs.done != 'true'
        run: |
          # +e is deliberate: Actions runs `bash -e` by default, which would
          # abort this script on the first failed launch instead of retrying.
          set +e -uo pipefail
          read -r -a ADS <<< "$ADS"
          START=$(date +%s)
          ATTEMPTS=0
          N_CAPACITY=0
          N_THROTTLE=0
          # Self-tuning pace, started at the measured equilibrium (85s) so it
          # does not spend the first minutes of every run climbing there.
          #
          # Measured across two pace settings, the number of ACCEPTED launches
          # was flat at 18-20 per 44min window (36s pace -> 20 useful of 40
          # attempts; 85s pace -> 18 useful of 25). Oracle accepts roughly one
          # launch per ~140s for this tenancy regardless of how often we ask,
          # so useful checks are quota-capped, not pace-capped. Pacing near the
          # quota keeps the same yield with far fewer pointless 429s; going
          # slower would only lose checks.
          PACE="$SLEEP_BETWEEN_PASSES"
          PACE_MAX=180
          BACKOFF=60
          CONSEC_THROTTLE=0
          declare -A SEEN_ERRORS=()

          # Classify a failed launch. Echoes one of:
          #   capacity | throttle | limit | fatal | unknown
          classify() {
            case "$1" in
              *"Out of host capacity"*|*outOfCapacity*|*OutOfCapacity*) echo capacity ;;
              *TooManyRequests*|*"429"*|*Throttl*)                      echo throttle ;;
              *LimitExceeded*|*QuotaExceeded*|*"exceed"*"limit"*)       echo limit ;;
              *"volume size"*|*VolumeSize*|*"storage"*"limit"*)         echo limit ;;
              *NotAuthenticated*|*NotAuthorizedOrNotFound*|*"401"*|*"403"*) echo fatal ;;
              *) echo unknown ;;
            esac
          }

          while true; do
            ELAPSED=$(( $(date +%s) - START ))
            if [ "$ELAPSED" -gt "$DEADLINE_SECONDS" ]; then
              echo "--- window closed after ${ELAPSED}s ---"
              echo "attempts=$ATTEMPTS  no-capacity=$N_CAPACITY  rate-limited=$N_THROTTLE  final-pace=${PACE}s"
              echo "useful capacity checks: $N_CAPACITY (a throttled request never reaches the check)"
              if [ "$ATTEMPTS" -gt 0 ] && [ $(( N_THROTTLE * 100 / ATTEMPTS )) -gt 25 ]; then
                echo "::warning::${N_THROTTLE}/${ATTEMPTS} attempts were rate-limited — consider longer sleeps."
              fi
              echo "The next run takes over."
              echo "outcome=timeout" >> "$GITHUB_OUTPUT"
              exit 0
            fi

            for AD in "${ADS[@]}"; do
              ATTEMPTS=$((ATTEMPTS + 1))
              # --no-retry is essential. By default the CLI retries a failed
              # launch internally with exponential backoff: measured at 101s per
              # attempt versus 1s with the flag, and each of those hidden
              # retries is a separate API request, so a single logical attempt
              # became a burst of ~8 and Oracle rate-limited us (37% of attempts
              # came back TooManyRequests). One request per attempt, paced by
              # the sleeps below, is both faster and gentler.
              #
              # No --wait-for-state either: a launch that is accepted returns
              # PROVISIONING, and waiting 1s for RUNNING would time out and be
              # misread as a failure while the instance is actually being built.
              OUT=$(oci compute instance launch \
                --no-retry \
                --availability-domain "$AD" \
                --compartment-id "$OCI_TENANCY" \
                --shape 'VM.Standard.A1.Flex' \
                --shape-config "{\"ocpus\":${OCPUS},\"memoryInGBs\":${MEMORY_GB}}" \
                --image-id "$IMAGE_ID" \
                --subnet-id "$SUBNET_ID" \
                --assign-public-ip true \
                --boot-volume-size-in-gbs "$BOOT_GB" \
                --ssh-authorized-keys-file ~/.ssh/oracle.pub \
                --display-name "sniper-$(date -u +%m%d-%H%M%S)" \
                2>&1)
              RC=$?

              if [ "$RC" -eq 0 ]; then
                INSTANCE_ID=$(echo "$OUT" | jq -r '.data.id')
                echo "::notice::Launch accepted in $AD after $ATTEMPTS attempts."
                {
                  echo "outcome=success"
                  echo "instance_id=$INSTANCE_ID"
                  echo "ad=$AD"
                  echo "attempts=$ATTEMPTS"
                } >> "$GITHUB_OUTPUT"
                exit 0
              fi

              KIND=$(classify "$OUT")
              case "$KIND" in
                capacity)
                  N_CAPACITY=$((N_CAPACITY + 1))
                  CONSEC_THROTTLE=0
                  BACKOFF=60
                  # Ease back toward the configured pace, but slowly — a single
                  # good answer is not proof the limit has lifted.
                  [ "$PACE" -gt "$SLEEP_BETWEEN_PASSES" ] && PACE=$(( PACE - 5 ))
                  printf '%s  %-28s no capacity  (pace %ss)\n' \
                    "$(date -u +%H:%M:%S)" "${AD##*:}" "$PACE"
                  ;;
                throttle)
                  N_THROTTLE=$((N_THROTTLE + 1))
                  CONSEC_THROTTLE=$((CONSEC_THROTTLE + 1))
                  # Widen the steady-state pace, not just this one sleep. The
                  # previous version reset the backoff on every capacity reply,
                  # so in an alternating capacity/throttle pattern it never
                  # escalated and half of all attempts stayed wasted.
                  [ "$PACE" -lt "$PACE_MAX" ] && PACE=$(( PACE + 15 ))
                  [ "$PACE" -gt "$PACE_MAX" ] && PACE="$PACE_MAX"
                  echo "$(date -u +%H:%M:%S)  rate-limited, sleeping ${BACKOFF}s (pace now ${PACE}s)"
                  sleep "$BACKOFF"
                  if [ "$CONSEC_THROTTLE" -ge 2 ]; then
                    BACKOFF=$(( BACKOFF * 2 ))
                    [ "$BACKOFF" -gt 300 ] && BACKOFF=300
                  fi
                  ;;
                limit)
                  echo "::warning::Service limit reached — your tenancy already holds its A1.Flex allowance (2 OCPU / 12 GB as of 2026-08)."
                  echo "Either the A1 core/memory allowance or the 200 GB storage cap is full."
                  echo "Delete an existing instance/volume, or lower ocpus/memory_gb/boot_gb."
                  echo "$OUT" | tail -5
                  echo "outcome=limit" >> "$GITHUB_OUTPUT"
                  exit 0
                  ;;
                fatal)
                  echo "::error::Authorization failed. Verify the API key is still active and the user has instance-launch permission."
                  echo "$OUT" | tail -10
                  exit 1
                  ;;
                unknown)
                  # Print each distinct unexpected error once, so a real
                  # misconfiguration cannot hide inside a wall of retries.
                  SIG=$(echo "$OUT" | grep -oE '"code": "[^"]+"' | head -1)
                  SIG="${SIG:-$(echo "$OUT" | tail -1 | cut -c1-60)}"
                  if [ -z "${SEEN_ERRORS[$SIG]:-}" ]; then
                    SEEN_ERRORS[$SIG]=1
                    echo "::warning::Unexpected error from launch (shown once):"
                    echo "$OUT" | tail -15
                  fi
                  ;;
              esac
              sleep "$SLEEP_BETWEEN_ADS"
            done
            sleep "$PACE"
          done

      - name: Collect instance details
        id: details
        if: steps.snipe.outputs.outcome == 'success'
        run: |
          set -uo pipefail
          ID='${{ steps.snipe.outputs.instance_id }}'
          echo "Waiting for the instance to reach RUNNING..."
          oci compute instance get --instance-id "$ID" \
            --wait-for-state RUNNING --max-wait-seconds 600 >/dev/null 2>&1 || true

          # The VNIC is often attached a little after the instance reports
          # RUNNING, so a single query can come back empty. This path runs
          # exactly once in the project's life — retry rather than report
          # "ubuntu@pending" and make the IP hunt manual.
          IP=""
          for _ in $(seq 1 10); do
            IP=$(oci compute instance list-vnics --instance-id "$ID" \
                   --query 'data[0]."public-ip"' --raw-output 2>/dev/null || true)
            [ -n "$IP" ] && [ "$IP" != "null" ] && break
            sleep 15
          done
          [ "$IP" = "null" ] && IP=""
          STATE=$(oci compute instance get --instance-id "$ID" \
                 --query 'data."lifecycle-state"' --raw-output 2>/dev/null || echo UNKNOWN)

          {
            echo "ip=${IP:-pending}"
            echo "state=$STATE"
          } >> "$GITHUB_OUTPUT"
          echo "State: $STATE"
          echo "Public IP: ${IP:-pending}"

      - name: File the report and stop the cron
        if: steps.snipe.outputs.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          IP: ${{ steps.details.outputs.ip }}
          STATE: ${{ steps.details.outputs.state }}
          AD: ${{ steps.snipe.outputs.ad }}
          ATTEMPTS: ${{ steps.snipe.outputs.attempts }}
          INSTANCE_ID: ${{ steps.snipe.outputs.instance_id }}
        run: |
          set +e -uo pipefail
          # Stop first: the cron must not fire again and grab a second instance
          # while this report is still being written. --repo is required because
          # there is no checkout, so gh cannot infer the repository from git.
          gh workflow disable "${{ github.workflow }}" --repo "${{ github.repository }}" \
            && echo "Schedule disabled." \
            || echo "::warning::Could not disable the schedule automatically — turn it off from the Actions tab."

          cat > /tmp/body.md <<EOF
          抢到实例了 🎉

          | | |
          |---|---|
          | 公网 IP | \`${IP}\` |
          | 状态 | ${STATE} |
          | 可用域 | ${AD} |
          | 规格 | VM.Standard.A1.Flex · ${OCPUS} OCPU / ${MEMORY_GB} GB |
          | 系统盘 | ${BOOT_GB} GB |
          | 区域 | ${OCI_REGION} |
          | 尝试次数 | ${ATTEMPTS}（本次运行内） |
          | Instance OCID | \`${INSTANCE_ID}\` |

          登录：

          \`\`\`bash
          ssh -i ~/.ssh/oracle_arm ubuntu@${IP}
          \`\`\`

          **定时任务已自动关闭**，不会再继续抢第二台。
          若要放行端口，去 Oracle 控制台给该子网的安全列表加入站规则
          （新开的实例默认只通 22）。

          ---
          由 [run #${{ github.run_number }}](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}) 自动创建。
          EOF
          sed -i 's/^[[:space:]]\{10\}//' /tmp/body.md

          # --assignee guarantees an email even if the repo is not watched.
          gh issue create \
            --repo "${{ github.repository }}" \
            --title "✅ 抢到 Oracle ARM 实例 — ${IP}" \
            --body-file /tmp/body.md \
            --assignee "${{ github.repository_owner }}" \
            || { echo "::warning::Issue creation failed; the details are printed below."; cat /tmp/body.md; }

      # The relay. GitHub's cron is unreliable (it had not fired once in the
      # first 40 minutes here), so each run hands off to the next itself.
      # always() matters: an unexpected failure must not silently end the hunt.
      - name: Hand off to the next run
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          OUTCOME: ${{ steps.snipe.outputs.outcome }}
        run: |
          set +e -uo pipefail

          if [ "${{ steps.existing.outputs.done }}" = "true" ]; then
            echo "An instance already exists — chain ends here."
            exit 0
          fi

          # Stop the chain only when the job is genuinely finished with it.
          case "${OUTCOME:-}" in
            success)
              echo "Instance acquired — chain ends here."
              exit 0 ;;
            limit)
              echo "Quota is full — chain ends here so it cannot spin forever."
              exit 0 ;;
          esac

          # A hard failure (bad credential, image gone) would otherwise relay
          # every 45 min forever. Let it retry a few times in case the cause is
          # transient, then stop and leave the failed runs visible.
          if [ "${{ job.status }}" = "failure" ]; then
            RECENT=$(gh run list --repo "${{ github.repository }}" \
                       --workflow "${{ github.workflow }}" --limit 6 \
                       --json conclusion --jq '[.[]|select(.conclusion=="failure")]|length' \
                     2>/dev/null || echo 0)
            if [ "${RECENT:-0}" -ge 5 ]; then
              echo "::error::5 of the last 6 runs failed. Stopping the chain — fix the cause, then Run workflow again."
              exit 0
            fi
            echo "::warning::This run failed; relaying anyway (${RECENT}/6 recent failures)."
          fi

          # Pass the current settings along so the chain keeps the same target.
          gh workflow run "${{ github.workflow }}" \
            --repo "${{ github.repository }}" \
            -f ocpus="$OCPUS" \
            -f memory_gb="$MEMORY_GB" \
            -f os_version="$OS_VERSION" \
            -f boot_gb="$BOOT_GB" \
            && echo "Next run dispatched. The hunt continues." \
            || {
                 echo "::error::Could not dispatch the next run — the chain is broken."
                 echo "Start it again from the Actions tab: Run workflow."
               }

