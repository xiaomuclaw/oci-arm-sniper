name: Oracle ARM Sniper

on:
  workflow_dispatch:
    inputs:
      ocpus:
        description: 'OCPU count (Always Free total = 2 as of 2026-08)'
        default: '2'
      memory_gb:
        description: 'Memory in GB (Always Free total = 12 as of 2026-08)'
        default: '12'
      os_version:
        description: 'Ubuntu version'
        default: '24.04'

  schedule:
    # Every 15 min. Each run loops for ~44 min, so coverage is continuous:
    # one run is always active and the next waits in the concurrency queue.
    - cron: '*/15 * * * *'

# Never run two snipers at once, and never cancel the active one.
concurrency:
  group: oracle-arm-sniper
  cancel-in-progress: false

permissions:
  issues: write   # to file the "instance acquired" report
  actions: write  # to disable the cron once we win

jobs:
  snipe:
    name: Snipe A1.Flex
    runs-on: ubuntu-latest
    timeout-minutes: 55
    env:
      OCI_CLI_SUPPRESS_FILE_PERMISSIONS_WARNING: 'True'
      OCI_TENANCY: ${{ secrets.TENANCY_OCID }}
      OCI_USER: ${{ secrets.USER_OCID }}
      OCI_REGION: ${{ secrets.REGION }}
      OCI_FINGERPRINT: ${{ secrets.FINGERPRINT }}
      SUBNET_ID: ${{ secrets.SUBNET_ID }}
      OCPUS: ${{ inputs.ocpus || '2' }}
      MEMORY_GB: ${{ inputs.memory_gb || '12' }}
      OS_VERSION: ${{ inputs.os_version || '24.04' }}
      DEADLINE_SECONDS: '2640'   # 44 min, leaves headroom under timeout-minutes
      SLEEP_BETWEEN_ADS: '5'
      SLEEP_BETWEEN_PASSES: '30'

    steps:
      - name: Install OCI CLI
        run: |
          curl -fsSL -o /tmp/oci-install.sh \
            https://raw.githubusercontent.com/oracle/oci-cli/master/scripts/install/install.sh
          chmod +x /tmp/oci-install.sh
          /tmp/oci-install.sh --accept-all-defaults >/tmp/oci-install.log 2>&1 \
            || { tail -40 /tmp/oci-install.log; exit 1; }
          echo "$HOME/bin" >> "$GITHUB_PATH"

      - name: Write OCI config
        run: |
          mkdir -p ~/.oci ~/.ssh
          cat > ~/.oci/config <<EOF
          [DEFAULT]
          user=${OCI_USER}
          fingerprint=${OCI_FINGERPRINT}
          tenancy=${OCI_TENANCY}
          region=${OCI_REGION}
          key_file=$HOME/.oci/key.pem
          EOF
          cat > ~/.oci/key.pem <<'EOF'
          ${{ secrets.PRIVATE_KEY }}
          EOF
          cat > ~/.ssh/oracle.pub <<'EOF'
          ${{ secrets.USER_SSH_PUB_KEY }}
          EOF
          # Tolerate a key pasted with leading spaces; PEM/SSH lines have none.
          sed -i 's/^[[:space:]]*//' ~/.oci/key.pem ~/.ssh/oracle.pub
          chmod 600 ~/.oci/config ~/.oci/key.pem
          # Fail loudly now rather than looking like "no stock" for 45 minutes.
          if ! grep -q 'BEGIN.*PRIVATE KEY' ~/.oci/key.pem; then
            echo "::error::PRIVATE_KEY secret is not a PEM private key."
            echo "Paste the whole api_key.pem including BEGIN/END lines."
            exit 1
          fi
          if ! grep -qE '^(ssh-rsa|ssh-ed25519|ecdsa-sha2-)' ~/.ssh/oracle.pub; then
            echo "::error::USER_SSH_PUB_KEY is not an SSH public key."
            echo "Use the .pub file contents (starts with ssh-rsa or ssh-ed25519)."
            exit 1
          fi

      - name: Preflight — verify credentials and resolve targets
        run: |
          # +e because every check below reports its own error message; the
          # default `bash -e` would abort first and print nothing useful.
          set +e -uo pipefail

          if ! ADS_JSON=$(oci iam availability-domain list 2>&1); then
            echo "::error::Cannot authenticate to OCI. Check TENANCY_OCID, USER_OCID, FINGERPRINT, PRIVATE_KEY, REGION."
            echo "$ADS_JSON" | tail -20
            exit 1
          fi
          mapfile -t ADS < <(echo "$ADS_JSON" | jq -r '.data[].name' 2>/dev/null | sort)
          if [ "${#ADS[@]}" -eq 0 ]; then
            echo "::error::No availability domains parsed for this region."
            echo "--- raw response from 'oci iam availability-domain list' ---"
            echo "$ADS_JSON" | head -40
            exit 1
          fi

          IMAGE_ID=$(oci compute image list \
            --compartment-id "$OCI_TENANCY" \
            --operating-system 'Canonical Ubuntu' \
            --operating-system-version "$OS_VERSION" \
            --shape 'VM.Standard.A1.Flex' \
            --sort-by TIMECREATED --sort-order DESC \
            --query 'data[0].id' --raw-output 2>/dev/null)
          if [ -z "${IMAGE_ID:-}" ] || [ "$IMAGE_ID" = "null" ]; then
            echo "::error::No Ubuntu $OS_VERSION ARM image found in $OCI_REGION."
            exit 1
          fi

          # Confirm the subnet exists and note its VCN, so a wrong-region subnet
          # surfaces here instead of masquerading as an out-of-capacity error.
          if ! SUBNET=$(oci network subnet get --subnet-id "$SUBNET_ID" 2>&1); then
            echo "::error::SUBNET_ID is not reachable in region $OCI_REGION."
            echo "$SUBNET" | tail -10
            exit 1
          fi

          {
            echo "ADS=${ADS[*]}"
            echo "IMAGE_ID=$IMAGE_ID"
          } >> "$GITHUB_ENV"

          echo "Region      : $OCI_REGION"
          echo "Domains     : ${ADS[*]}"
          echo "Shape       : VM.Standard.A1.Flex  ${OCPUS} OCPU / ${MEMORY_GB} GB"
          echo "Image       : $IMAGE_ID (Ubuntu $OS_VERSION)"
          echo "Subnet      : $(echo "$SUBNET" | jq -r '.data."display-name"')"

      - name: Snipe loop
        id: snipe
        run: |
          # +e is deliberate: Actions runs `bash -e` by default, which would
          # abort this script on the first failed launch instead of retrying.
          set +e -uo pipefail
          read -r -a ADS <<< "$ADS"
          START=$(date +%s)
          ATTEMPTS=0
          declare -A SEEN_ERRORS=()

          # Classify a failed launch. Echoes one of:
          #   capacity | throttle | limit | fatal | unknown
          classify() {
            case "$1" in
              *"Out of host capacity"*|*outOfCapacity*|*OutOfCapacity*) echo capacity ;;
              *TooManyRequests*|*"429"*|*Throttl*)                      echo throttle ;;
              *LimitExceeded*|*QuotaExceeded*|*"exceed"*"limit"*)       echo limit ;;
              *NotAuthenticated*|*NotAuthorizedOrNotFound*|*"401"*|*"403"*) echo fatal ;;
              *) echo unknown ;;
            esac
          }

          while true; do
            ELAPSED=$(( $(date +%s) - START ))
            if [ "$ELAPSED" -gt "$DEADLINE_SECONDS" ]; then
              echo "Reached the ${DEADLINE_SECONDS}s window after $ATTEMPTS attempts. The next scheduled run takes over."
              echo "outcome=timeout" >> "$GITHUB_OUTPUT"
              exit 0
            fi

            for AD in "${ADS[@]}"; do
              ATTEMPTS=$((ATTEMPTS + 1))
              # No --wait-for-state here: a launch that is accepted returns
              # PROVISIONING, and waiting 1s for RUNNING would time out and be
              # misread as a failure while the instance is actually being built.
              OUT=$(oci compute instance launch \
                --availability-domain "$AD" \
                --compartment-id "$OCI_TENANCY" \
                --shape 'VM.Standard.A1.Flex' \
                --shape-config "{\"ocpus\":${OCPUS},\"memoryInGBs\":${MEMORY_GB}}" \
                --image-id "$IMAGE_ID" \
                --subnet-id "$SUBNET_ID" \
                --assign-public-ip true \
                --boot-volume-size-in-gbs 50 \
                --ssh-authorized-keys-file ~/.ssh/oracle.pub \
                --display-name "sniper-$(date -u +%m%d-%H%M%S)" \
                2>&1)
              RC=$?

              if [ "$RC" -eq 0 ]; then
                INSTANCE_ID=$(echo "$OUT" | jq -r '.data.id')
                echo "::notice::Launch accepted in $AD after $ATTEMPTS attempts."
                {
                  echo "outcome=success"
                  echo "instance_id=$INSTANCE_ID"
                  echo "ad=$AD"
                  echo "attempts=$ATTEMPTS"
                } >> "$GITHUB_OUTPUT"
                exit 0
              fi

              KIND=$(classify "$OUT")
              case "$KIND" in
                capacity)
                  printf '%s  %-28s no capacity\n' "$(date -u +%H:%M:%S)" "${AD##*:}"
                  ;;
                throttle)
                  echo "$(date -u +%H:%M:%S)  throttled by Oracle, backing off 60s"
                  sleep 60
                  ;;
                limit)
                  echo "::warning::Service limit reached — your tenancy already holds its A1.Flex allowance (2 OCPU / 12 GB as of 2026-08)."
                  echo "Delete an existing ARM instance, or lower the ocpus/memory_gb inputs."
                  echo "$OUT" | tail -5
                  echo "outcome=limit" >> "$GITHUB_OUTPUT"
                  exit 0
                  ;;
                fatal)
                  echo "::error::Authorization failed. Verify the API key is still active and the user has instance-launch permission."
                  echo "$OUT" | tail -10
                  exit 1
                  ;;
                unknown)
                  # Print each distinct unexpected error once, so a real
                  # misconfiguration cannot hide inside a wall of retries.
                  SIG=$(echo "$OUT" | grep -oE '"code": "[^"]+"' | head -1)
                  SIG="${SIG:-$(echo "$OUT" | tail -1 | cut -c1-60)}"
                  if [ -z "${SEEN_ERRORS[$SIG]:-}" ]; then
                    SEEN_ERRORS[$SIG]=1
                    echo "::warning::Unexpected error from launch (shown once):"
                    echo "$OUT" | tail -15
                  fi
                  ;;
              esac
              sleep "$SLEEP_BETWEEN_ADS"
            done
            sleep "$SLEEP_BETWEEN_PASSES"
          done

      - name: Collect instance details
        id: details
        if: steps.snipe.outputs.outcome == 'success'
        run: |
          set -uo pipefail
          ID='${{ steps.snipe.outputs.instance_id }}'
          echo "Waiting for the instance to reach RUNNING..."
          oci compute instance get --instance-id "$ID" \
            --wait-for-state RUNNING --max-wait-seconds 600 >/dev/null 2>&1 || true

          IP=$(oci compute instance list-vnics --instance-id "$ID" \
                 --query 'data[0]."public-ip"' --raw-output 2>/dev/null || true)
          STATE=$(oci compute instance get --instance-id "$ID" \
                 --query 'data."lifecycle-state"' --raw-output 2>/dev/null || echo UNKNOWN)

          {
            echo "ip=${IP:-pending}"
            echo "state=$STATE"
          } >> "$GITHUB_OUTPUT"
          echo "State: $STATE"
          echo "Public IP: ${IP:-pending}"

      - name: File the report and stop the cron
        if: steps.snipe.outputs.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          IP: ${{ steps.details.outputs.ip }}
          STATE: ${{ steps.details.outputs.state }}
          AD: ${{ steps.snipe.outputs.ad }}
          ATTEMPTS: ${{ steps.snipe.outputs.attempts }}
          INSTANCE_ID: ${{ steps.snipe.outputs.instance_id }}
        run: |
          set -uo pipefail
          # Stop first: the cron must not fire again and grab a second instance
          # while this report is still being written.
          gh workflow disable "${{ github.workflow }}" 2>/dev/null \
            && echo "Schedule disabled." \
            || echo "::warning::Could not disable the schedule automatically — turn it off from the Actions tab."

          cat > /tmp/body.md <<EOF
          抢到实例了 🎉

          | | |
          |---|---|
          | 公网 IP | \`${IP}\` |
          | 状态 | ${STATE} |
          | 可用域 | ${AD} |
          | 规格 | VM.Standard.A1.Flex · ${OCPUS} OCPU / ${MEMORY_GB} GB |
          | 区域 | ${OCI_REGION} |
          | 尝试次数 | ${ATTEMPTS}（本次运行内） |
          | Instance OCID | \`${INSTANCE_ID}\` |

          登录：

          \`\`\`bash
          ssh -i <你的私钥> ubuntu@${IP}
          \`\`\`

          **定时任务已自动关闭**，不会再继续抢第二台。
          若要放行端口，去 Oracle 控制台给该子网的安全列表加入站规则
          （新开的实例默认只通 22）。

          ---
          由 [run #${{ github.run_number }}](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}) 自动创建。
          EOF
          sed -i 's/^[[:space:]]\{10\}//' /tmp/body.md

          gh issue create \
            --title "✅ 抢到 Oracle ARM 实例 — ${IP}" \
            --body-file /tmp/body.md \
            || { echo "::warning::Issue creation failed; details are in this log."; cat /tmp/body.md; }

