name: TEST self chain

# Throwaway: proves a run can dispatch the next run using github.token.
# GITHUB_TOKEN normally cannot trigger workflows; workflow_dispatch is
# documented as an exception, but that claim needs proving before the
# sniper relies on it. depth caps the chain so it cannot run away.
on:
  workflow_dispatch:
    inputs:
      depth:
        description: 'chain depth'
        default: '0'

permissions:
  actions: write

jobs:
  chain:
    runs-on: ubuntu-latest
    steps:
      - name: Report and re-dispatch
        env:
          GH_TOKEN: ${{ github.token }}
          DEPTH: ${{ inputs.depth }}
        run: |
          set +e -uo pipefail
          echo "CHAIN_DEPTH=$DEPTH"
          if [ "$DEPTH" -ge 2 ]; then
            echo "CHAIN_STOP (reached cap)"
            exit 0
          fi
          NEXT=$((DEPTH + 1))
          gh workflow run "TEST self chain" \
            --repo "${{ github.repository }}" \
            -f depth="$NEXT" \
            && echo "DISPATCH_OK -> depth $NEXT" \
            || echo "DISPATCH_FAILED"
