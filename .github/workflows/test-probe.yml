name: TEST probe retry

# Throwaway: find out why each launch attempt takes minutes instead of seconds.
on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    env:
      OCI_CLI_SUPPRESS_FILE_PERMISSIONS_WARNING: 'True'
      SUPPRESS_LABEL_WARNING: 'True'
      OCI_TENANCY: ${{ secrets.TENANCY_OCID }}
      OCI_USER: ${{ secrets.USER_OCID }}
      OCI_REGION: ${{ secrets.REGION }}
      OCI_FINGERPRINT: ${{ secrets.FINGERPRINT }}
      SUBNET_ID: ${{ secrets.SUBNET_ID }}
    steps:
      - name: Install OCI CLI
        run: |
          curl -fsSL -o /tmp/i.sh https://raw.githubusercontent.com/oracle/oci-cli/master/scripts/install/install.sh
          chmod +x /tmp/i.sh && /tmp/i.sh --accept-all-defaults >/dev/null 2>&1
          echo "$HOME/bin" >> "$GITHUB_PATH"

      - name: Config
        run: |
          mkdir -p ~/.oci ~/.ssh
          cat > ~/.oci/config <<EOF
          [DEFAULT]
          user=${OCI_USER}
          fingerprint=${OCI_FINGERPRINT}
          tenancy=${OCI_TENANCY}
          region=${OCI_REGION}
          key_file=$HOME/.oci/key.pem
          EOF
          cat > ~/.oci/key.pem <<'EOF'
          ${{ secrets.PRIVATE_KEY }}
          EOF
          cat > ~/.ssh/oracle.pub <<'EOF'
          ${{ secrets.USER_SSH_PUB_KEY }}
          EOF
          sed -i 's/^[[:space:]]*//' ~/.oci/key.pem ~/.ssh/oracle.pub
          chmod 600 ~/.oci/config ~/.oci/key.pem

      - name: What retry flags exist
        run: |
          set +e
          echo "=== CLI version ==="; oci --version
          echo "=== retry-related global flags ==="
          oci compute instance launch --help 2>/dev/null | grep -iE "retry|attempt|timeout" | head -20
          echo "=== does --no-retry parse? ==="
          oci iam availability-domain list --no-retry >/dev/null 2>&1 \
            && echo "  --no-retry ACCEPTED" || echo "  --no-retry REJECTED"
          echo "=== does --max-attempts parse? ==="
          oci iam availability-domain list --max-attempts 1 >/dev/null 2>&1 \
            && echo "  --max-attempts ACCEPTED" || echo "  --max-attempts REJECTED"

      - name: Time a real launch, default vs no-retry
        run: |
          set +e
          IMG=$(oci compute image list --compartment-id "$OCI_TENANCY" \
                  --operating-system 'Canonical Ubuntu' --operating-system-version 24.04 \
                  --shape VM.Standard.A1.Flex --sort-by TIMECREATED --sort-order DESC \
                  --query 'data[0].id' --raw-output 2>/dev/null)
          AD=$(oci iam availability-domain list 2>/dev/null | jq -r '.data[0].name')
          echo "AD=$AD"

          launch() {
            oci compute instance launch --availability-domain "$AD" \
              --compartment-id "$OCI_TENANCY" --shape VM.Standard.A1.Flex \
              --shape-config '{"ocpus":2,"memoryInGBs":12}' --image-id "$IMG" \
              --subnet-id "$SUBNET_ID" --assign-public-ip true \
              --boot-volume-size-in-gbs 150 \
              --ssh-authorized-keys-file ~/.ssh/oracle.pub \
              --display-name "probe-$(date -u +%H%M%S)" "$@" 2>&1
          }

          echo "=== A: default (current behaviour) ==="
          S=$(date +%s); OUT=$(launch); RC=$?; E=$(( $(date +%s) - S ))
          echo "  elapsed=${E}s rc=$RC"
          echo "$OUT" | grep -oE '"(code|message)": "[^"]*"' | head -3
          if [ "$RC" -eq 0 ]; then echo "  ::warning::LAUNCH SUCCEEDED (A)"; echo "$OUT" | jq -r '.data.id'; fi

          echo "=== B: --no-retry ==="
          S=$(date +%s); OUT=$(launch --no-retry); RC=$?; E=$(( $(date +%s) - S ))
          echo "  elapsed=${E}s rc=$RC"
          echo "$OUT" | grep -oE '"(code|message)": "[^"]*"' | head -3
          if [ "$RC" -eq 0 ]; then echo "  ::warning::LAUNCH SUCCEEDED (B)"; echo "$OUT" | jq -r '.data.id'; fi
